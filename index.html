<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剑仙情缘恩仇录 · 试玩</title>
<style>
  :root { --kai: "Kaiti SC","STKaiti","KaiTi","楷体","LXGW WenKai","Noto Serif CJK SC","Songti SC",serif; --song: "Songti SC","STSong","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif; --ink:#2b221c; --paper:#efe4c8; --gold:#d7a544; --red:#a8362a; --ts:1; --da:.72; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #070605; overflow: hidden; color: var(--paper); font-family: var(--song); -webkit-font-smoothing: antialiased; }
  body { display: flex; align-items: center; justify-content: center; user-select: none; -webkit-user-select: none; }
  #stage { position: relative; width: 100vw; height: 56.25vw; overflow: hidden; background: #000; cursor: default; }
  #world { position: absolute; inset: 0; width: 100%; height: 100%; display: block; transition: filter .9s; }

  #tone { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 46%, rgba(0,0,0,0) 64%, rgba(10,6,4,.14) 100%); }
  #tone.sepia { background: radial-gradient(ellipse at 50% 46%, rgba(120,90,50,.04) 50%, rgba(30,18,8,.38) 100%); }
  #ui { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; pointer-events: none; }
  #ui > * { position: absolute; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 1; pointer-events: none; }
  .hide { display: none !important; }
  #boot { position: fixed; left: 0; right: 0; top: 46%; z-index: 99; text-align: center; font: 22px/1.8 "Kaiti SC", "STKaiti", "KaiTi", serif; letter-spacing: .2em; color: rgba(228,207,154,.55); pointer-events: none; }
  #boot.bad { top: 38%; letter-spacing: .05em; color: #f6e9c8; pointer-events: auto; }
  #boot.bad span { display: inline-block; margin-top: 18px; padding: 8px 30px; border: 1.5px solid #d7a544; border-radius: 6px; cursor: pointer; }
  .jx-clickable { pointer-events: auto; cursor: pointer; }

  /* 指引与提示 */
  #obj { left: 30px; top: 26px; max-width: 660px; padding: 12px 24px 14px 18px; color: #f6e9c8; background: rgba(24,16,11,.6); border-left: 5px solid var(--gold); border-radius: 0 8px 8px 0; text-shadow: 0 1px 2px #000; box-shadow: 0 4px 18px rgba(0,0,0,.28); }
  #obj .k { font: 600 19px var(--kai); color: var(--gold); letter-spacing: .35em; }
  #obj .t { font: 600 29px/1.3 var(--kai); margin-top: 3px; }
  #obj .d { font: 22px/1.5 var(--kai); color: #efe2bf; margin-top: 7px; padding-top: 7px; border-top: 1px solid rgba(215,165,68,.35); }
  #obj .h { font: 20px/1.4 var(--kai); color: #d2c096; margin-top: 7px; }
  #keys { right: 30px; bottom: 22px; font: 20px/1.4 var(--kai); color: rgba(246,233,200,.62); text-shadow: 0 1px 3px #000; text-align: right; }
  #purse { right: 34px; top: 30px; font: 600 26px var(--kai); color: #f6e9c8; text-shadow: 0 1px 3px #000; background: rgba(30,20,14,.7); padding: 8px 18px; border-radius: 4px; border: 1px solid rgba(215,165,68,.5); }
  #banner { left: 0; top: 150px; width: 1920px; text-align: center; opacity: 0; transition: opacity .8s; }
  #banner .n { font: 600 76px var(--kai); letter-spacing: .3em; margin-left: .3em; color: #f8ecd0; text-shadow: 0 2px 18px rgba(0,0,0,.9), 0 0 3px #000; }
  #banner .s { font: 26px var(--kai); letter-spacing: .4em; color: #e4cf9a; margin-top: 8px; text-shadow: 0 1px 6px #000; }
  #banner .l { width: 360px; height: 2px; margin: 14px auto 0; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  #toast { left: 0; top: 120px; width: 1920px; text-align: center; opacity: 0; transition: opacity .35s; }
  #toast span { display: inline-block; font: 600 28px var(--kai); color: #f6e9c8; background: rgba(34,22,14,.9); border: 1px solid rgba(215,165,68,.7); padding: 10px 30px; border-radius: 6px; }

  /* 对白 */
  #dlg { left: 297px; top: 832px; width: 1326px; height: 224px; pointer-events: auto; }
  #dlg .box { position: absolute; left: 86px; top: 26px; right: 0; bottom: 0; background: linear-gradient(180deg, rgba(247,238,216,var(--da)), rgba(234,221,188,var(--da))); border: 2px solid rgba(61,42,28,.82); border-radius: 6px; box-shadow: 0 8px 26px rgba(0,0,0,.3), inset 0 0 0 1px rgba(250,243,224,.55), inset 0 0 0 3px rgba(168,54,42,.24); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); }
  #dlg .med { position: absolute; left: 0; bottom: 0; width: 190px; height: 218px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.4)); background: radial-gradient(ellipse at 50% 46%, rgba(247,238,216,.5), rgba(247,238,216,.18) 46%, rgba(247,238,216,0) 70%); }
  #dlg .name { position: absolute; left: 204px; top: 3px; min-width: 116px; padding: 4px 20px 5px; text-align: center; font: 600 27px var(--kai); letter-spacing: .12em; color: #f8ecd0; background: linear-gradient(180deg, rgba(178,60,46,.96), rgba(142,42,32,.96)); border: 2px solid #3d2a1c; border-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,.4), inset 0 0 0 1px rgba(255,220,160,.4); }
  #dlg .body { position: absolute; left: 206px; top: 62px; right: 46px; bottom: 12px; font: calc(32px * var(--ts)) / 1.5 var(--song); color: var(--ink); text-align: justify; overflow: hidden; text-shadow: 0 0 5px rgba(247,238,216,.95), 0 0 2px rgba(247,238,216,.9); }
  #dlg.nomed .body { left: 122px; }
  #dlg.nomed .name { left: 120px; }
  #dlg .body i { font-style: normal; font-family: var(--kai); color: #7a5d3a; }
  #dlg .next { position: absolute; right: 22px; bottom: 8px; font-size: 22px; color: var(--red); animation: bob 1s infinite; }
  @keyframes bob { 50% { transform: translateY(6px); } }
  #narr { left: 380px; top: 896px; width: 1160px; pointer-events: auto; padding: 16px 54px 18px; text-align: center; font: calc(30px * var(--ts)) / 1.6 var(--kai); color: #f6ebd0; background: linear-gradient(90deg, rgba(18,12,9,0), rgba(18,12,9,.6) 14%, rgba(18,12,9,.6) 86%, rgba(18,12,9,0)); text-shadow: 0 1px 3px #000, 0 0 8px rgba(0,0,0,.8); }
  #narr .next { position: absolute; right: 150px; bottom: 8px; font-size: 18px; color: var(--gold); animation: bob 1s infinite; }
  #cap { left: 0; top: 0; width: 1920px; height: 1080px; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; transition: opacity .9s; }
  #cap .t { font: 54px/1.7 var(--kai); letter-spacing: .16em; color: #f1e4c4; text-align: center; text-shadow: 0 2px 12px #000; }
  #cap .s { font: 28px var(--kai); letter-spacing: .1em; color: #c9b282; margin-top: 26px; }

  /* 题词：竖排，自右而左 */
  #card { left: 0; top: 0; width: 1920px; height: 1080px; display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 1s; background: radial-gradient(ellipse at center, rgba(8,5,3,.55), rgba(8,5,3,.9)); }
  #card .scroll { display: flex; flex-direction: row-reverse; align-items: flex-start; gap: 38px; padding: 70px 90px 60px; background: linear-gradient(180deg, #f1e6cb, #e2d2ac); border: 3px solid #3d2a1c; box-shadow: 0 20px 80px rgba(0,0,0,.8), inset 0 0 0 3px #f8f0dc, inset 0 0 0 5px rgba(168,54,42,.4), inset 0 0 120px rgba(120,90,40,.25); }
  #card .col { writing-mode: vertical-rl; font: 50px/1.5 var(--kai); letter-spacing: .22em; color: var(--ink); }
  #card .head { writing-mode: vertical-rl; font: 600 62px var(--kai); letter-spacing: .3em; color: #8e2a20; padding-left: 20px; border-left: 2px solid rgba(142,42,32,.5); }
  #card .src { writing-mode: vertical-rl; font: 28px var(--kai); letter-spacing: .2em; color: #6a5236; align-self: flex-end; }
  #card .seal { writing-mode: vertical-rl; align-self: flex-end; font: 600 24px var(--kai); color: #f8ecd0; background: #a8362a; padding: 8px 5px; border-radius: 3px; letter-spacing: .1em; }

  /* 选择、教学、面板 */
  #choice { left: 560px; top: 300px; width: 800px; pointer-events: auto; }
  #choice .hd { background: linear-gradient(180deg, rgba(40,27,18,.9), rgba(26,17,11,.9)); border: 1px solid rgba(215,165,68,.45); border-radius: 6px; padding: 16px 24px 14px; margin-bottom: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  #choice .q { font: 600 34px var(--kai); text-align: center; color: #f6e9c8; text-shadow: 0 2px 6px #000; }
  #choice .sub { font: 26px var(--kai); text-align: center; color: #e8d9b0; text-shadow: 0 2px 6px #000; margin-top: 6px; }
  .btn { display: block; width: 100%; margin: 12px 0; padding: 16px 30px; font: 32px var(--kai); color: var(--ink); text-align: center; background: linear-gradient(180deg, #f4ead2, #e3d3ad); border: 2px solid #3d2a1c; border-radius: 5px; box-shadow: 0 4px 14px rgba(0,0,0,.5), inset 0 0 0 2px rgba(168,54,42,.3); pointer-events: auto; cursor: pointer; }
  .btn.sel, .btn:hover { background: linear-gradient(180deg, #fff6dc, #f0dca8); box-shadow: 0 4px 18px rgba(0,0,0,.6), inset 0 0 0 3px #a8362a; }
  .btn.small { display: inline-block; width: auto; font-size: 26px; padding: 10px 26px; margin: 6px; }
  .btn.off { opacity: .45; }
  #tut { left: 410px; top: 300px; width: 1100px; padding: 40px 56px 34px; pointer-events: auto; background: linear-gradient(180deg, rgba(40,27,18,.96), rgba(26,17,11,.96)); border: 2px solid var(--gold); border-radius: 8px; box-shadow: 0 16px 60px rgba(0,0,0,.7); }
  #tut h3 { margin: 0 0 16px; font: 600 36px var(--kai); color: var(--gold); letter-spacing: .2em; }
  #tut p { margin: 0; font: calc(31px * var(--ts)) / 1.75 var(--kai); color: #f4e8cc; }
  #tut .ok { margin-top: 24px; text-align: right; font: 26px var(--kai); color: var(--gold); }
  kbd { display: inline-block; min-width: 1.5em; padding: 0 .35em; margin: 0 .12em; text-align: center; font: 600 .82em var(--song); color: #2b221c; background: #efe4c8; border-radius: 5px; border-bottom: 3px solid #b39b6a; }
  .panel { background: linear-gradient(180deg, #f3e8cf, #e4d5b0); color: var(--ink); border: 3px solid #3d2a1c; border-radius: 8px; box-shadow: 0 20px 80px rgba(0,0,0,.75), inset 0 0 0 2px #f8f0dc, inset 0 0 0 4px rgba(168,54,42,.4); pointer-events: auto; }
  .panel h2 { margin: 0 0 18px; font: 600 44px var(--kai); letter-spacing: .25em; color: #8e2a20; }
  .panel p { font: 28px/1.7 var(--kai); margin: 8px 0; }
  #menu { left: 360px; top: 130px; width: 1200px; height: 820px; padding: 44px 56px; }
  #menu .tabs { display: flex; gap: 10px; margin-bottom: 24px; border-bottom: 2px solid rgba(61,42,28,.4); }
  #menu .tab { padding: 10px 34px; font: 600 32px var(--kai); letter-spacing: .15em; color: #6a5236; cursor: pointer; pointer-events: auto; border-radius: 6px 6px 0 0; }
  #menu .tab.on { color: #f8ecd0; background: #8e2a20; }
  #menu .row { display: flex; align-items: center; justify-content: space-between; padding: 9px 4px; font: 30px var(--kai); border-bottom: 1px dashed rgba(61,42,28,.25); }
  #menu .opts span { display: inline-block; padding: 4px 18px; margin-left: 8px; border: 1.5px solid rgba(61,42,28,.5); border-radius: 4px; cursor: pointer; pointer-events: auto; font-size: 26px; }
  #menu .opts span.on { background: #3d2a1c; color: #f8ecd0; }
  #menu .scwrap { max-height: 486px; overflow-y: auto; margin: 4px 0 10px; padding-right: 8px; pointer-events: auto; }
  #menu .grp { margin: 8px 0 4px; font: 600 24px var(--kai); letter-spacing: .2em; color: #8e2a20; }
  #menu .scenes { display: grid; grid-template-columns: 1fr 1fr; gap: 7px 22px; margin: 0 0 6px; }
  #menu .scenes .sc { padding: 5px 20px; font: 26px var(--kai); border: 1.5px solid rgba(61,42,28,.5); border-radius: 5px; background: rgba(255,250,235,.45); }
  #menu .scenes .sc:hover { background: #fff6dc; box-shadow: inset 0 0 0 2px #a8362a; }
  #menu .scenes .sc.on { background: #3d2a1c; color: #f8ecd0; }
  #menu .scenes .sc i { float: right; font-style: normal; font-size: 21px; color: #e4cf9a; }
  #menu kbd, #obj kbd { display: inline-block; min-width: 1.5em; text-align: center; padding: 0 .35em; border: 1.5px solid currentColor; border-radius: 5px; font: 600 .82em/1.5 ui-monospace, Menlo, monospace; }
  #mini .memo { font-size: 24px; line-height: 1.5; color: #5a4128; }
  #menu .stat { display: flex; gap: 40px; }
  #menu .stat canvas { width: 218px; height: 250px; background: linear-gradient(180deg, #efe4c8, #dccba0); border: 2px solid #3d2a1c; border-radius: 5px; }
  #menu .stat table { font: 28px/1.6 var(--kai); border-collapse: collapse; }
  #menu .stat td { padding: 2px 22px 2px 0; } #menu .stat td:first-child { color: #7a5d3a; }
  #menu .moves { margin-top: 12px; font: 26px/1.7 var(--kai); }
  #menu .moves span { display: inline-block; margin: 4px 10px 4px 0; padding: 2px 16px; border: 1.5px solid rgba(61,42,28,.45); border-radius: 4px; color: rgba(43,34,28,.45); }
  #menu .moves span.got { color: #8e2a20; border-color: #8e2a20; background: rgba(168,54,42,.08); }
  #menu .foot { position: absolute; left: 56px; right: 56px; bottom: 34px; display: flex; justify-content: space-between; align-items: center; font: 24px var(--kai); color: #7a5d3a; }

  /* 行菜 */
  #mini { left: 310px; top: 190px; width: 1300px; padding: 40px 50px; }
  #mini .trays { display: flex; gap: 22px; margin-top: 18px; }
  #mini .tray { flex: 1; padding: 22px 16px 18px; text-align: center; font: 30px/1.75 var(--kai); background: radial-gradient(ellipse at 50% 30%, #a2553a, #6a2c1c); color: #f8ecd0; border: 3px solid #3d2a1c; border-radius: 50% / 16%; box-shadow: 0 6px 18px rgba(0,0,0,.5), inset 0 0 0 3px rgba(255,220,160,.25); cursor: pointer; pointer-events: auto; }
  #mini .tray:hover, #mini .tray.sel { box-shadow: 0 6px 24px rgba(0,0,0,.6), inset 0 0 0 4px #ffd778; }
  #mini .tray b { display: block; font: 600 24px var(--kai); color: #ffd778; letter-spacing: .2em; margin-bottom: 6px; }
  #mini .tray.gone { opacity: .25; pointer-events: none; }

  /* 特写画面 */
  #cut { left: 310px; top: 110px; width: 1300px; height: 640px; opacity: 0; transition: opacity .7s; border: 3px solid #3d2a1c; box-shadow: 0 20px 80px rgba(0,0,0,.85), 0 0 0 3px rgba(215,165,68,.5); }
  #cut canvas { width: 100%; height: 100%; display: block; }

  /* 标题 */
  #title { left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: auto; background: linear-gradient(90deg, rgba(8,5,4,.2), rgba(8,5,4,.05) 40%, rgba(8,5,4,.75) 78%); }
  #title .name { position: absolute; right: 250px; top: 96px; height: 900px; white-space: nowrap; writing-mode: vertical-rl; font: 600 108px var(--kai); letter-spacing: .1em; color: #f8ecd0; text-shadow: 0 4px 30px rgba(0,0,0,.9), 0 0 4px #000; }
  #title .sub { position: absolute; right: 180px; top: 116px; white-space: nowrap; writing-mode: vertical-rl; font: 34px var(--kai); letter-spacing: .5em; color: #e4cf9a; text-shadow: 0 2px 8px #000; }
  #title .seal { position: absolute; right: 412px; top: 690px; writing-mode: vertical-rl; font: 600 30px var(--kai); color: #f8ecd0; background: #a8362a; padding: 12px 7px; border-radius: 4px; letter-spacing: .12em; box-shadow: 0 2px 10px rgba(0,0,0,.6); }
  #title .menu { position: absolute; left: 150px; bottom: 150px; width: 420px; }
  #title .ver { position: absolute; left: 150px; bottom: 60px; font: 22px var(--kai); color: rgba(246,233,200,.6); text-shadow: 0 1px 3px #000; }
  #end { left: 460px; top: 240px; width: 1000px; padding: 50px 60px; text-align: center; }

  /* 战斗 */
  #bt { left: 0; top: 0; width: 1920px; height: 1080px; }
  #bt > * { position: absolute; transition: opacity .25s; }
  #bt .order { left: 390px; top: 20px; width: 1300px; display: flex; justify-content: center; align-items: flex-start; gap: 4px; }
  #bt .order .lab { margin: 18px 12px 0 0; padding: 4px 12px; font: 600 20px var(--kai); letter-spacing: .2em; color: #f8ecd0; background: rgba(142,42,32,.9); border-radius: 4px; }
  #bt .order .ar { margin-top: 16px; font: 30px var(--kai); color: rgba(246,233,200,.6); text-shadow: 0 1px 3px #000; }
  #bt .chip { width: 84px; text-align: center; opacity: .86; }
  #bt .chip canvas, #bt .chip .tk { display: block; box-sizing: border-box; width: 62px; height: 62px; margin: 0 auto; border-radius: 50%; border: 3px solid #3d2a1c; background: linear-gradient(180deg, #efe4c8, #d6c59a); box-shadow: 0 3px 8px rgba(0,0,0,.5); }
  #bt .chip .tk { font: 600 32px/56px var(--kai); color: #f8ecd0; background: linear-gradient(180deg, #5a3a2a, #2e1c14); }
  #bt .chip.s-foe canvas, #bt .chip.s-foe .tk { border-color: #a8362a; }
  #bt .goal { left: 30px; top: 26px; width: 350px; box-sizing: border-box; padding: 10px 16px 10px 14px; font: 600 23px/1.35 var(--kai); color: #f6e9c8; background: rgba(30,20,14,.82); border-left: 5px solid var(--gold); border-radius: 0 4px 4px 0; }
  #bt .goal b { margin-right: 8px; color: var(--gold); }
  #bt .chip.now { opacity: 1; }
  #bt .chip.now canvas, #bt .chip.now .tk { width: 76px; height: 76px; border-color: var(--gold); box-shadow: 0 0 18px rgba(215,165,68,.85); }
  #bt .chip.now .tk { line-height: 70px; font-size: 38px; }
  #bt .chip span { display: block; margin-top: 3px; font: 18px var(--kai); color: #f6e9c8; text-shadow: 0 1px 3px #000, 0 0 2px #000; white-space: nowrap; }
  #bt .wheel { right: 30px; top: 84px; width: 190px; text-align: center; }
  #bt .wheel canvas { width: 150px; height: 150px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.5)); }
  #bt .wheel .wl { margin-top: 4px; font: 20px/1.35 var(--kai); color: #f6e9c8; text-shadow: 0 1px 3px #000, 0 0 2px #000; }
  #bt .log { left: 360px; top: 128px; width: 1200px; text-align: center; font: 600 30px var(--kai); color: #f6e9c8; text-shadow: 0 2px 10px #000, 0 0 3px #000; }
  #bt .party { left: 30px; bottom: 24px; display: flex; flex-direction: column; gap: 10px; }
  #bt .card { position: relative; box-sizing: border-box; width: 340px; min-height: 92px; padding: 10px 14px 8px 94px; color: var(--ink); background: rgba(247,238,216,.92); border: 2px solid #3d2a1c; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  #bt .card.out { filter: grayscale(.8) brightness(.8); }
  #bt .card canvas { position: absolute; left: 8px; bottom: 0; width: 76px; height: 87px; }
  #bt .card b, #bt .foe b { font: 600 26px var(--kai); letter-spacing: .06em; }
  #bt .card em, #bt .foe em { margin-left: 10px; padding: 1px 8px; font: 600 18px var(--kai); font-style: normal; color: #f8ecd0; background: #5f9a6a; border-radius: 3px; vertical-align: 3px; }
  #bt .card em.st { background: #8e2a20; }
  #bt .bar { height: 12px; margin-top: 6px; background: rgba(61,42,28,.25); border: 1px solid #3d2a1c; border-radius: 6px; overflow: hidden; }
  #bt .bar i { display: block; height: 100%; background: linear-gradient(90deg, #b8433a, #de6a40); transition: width .3s; }
  #bt .card small { font: 18px var(--kai); color: #6a5236; }
  #bt .foes { right: 30px; bottom: 24px; display: flex; flex-direction: column; gap: 10px; }
  #bt .foe { box-sizing: border-box; width: 380px; padding: 10px 16px 12px; color: #f6e9c8; background: rgba(40,26,20,.9); border: 2px solid #a8362a; border-radius: 6px; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  #bt .foe em { background: #c9a24a; color: #2b221c; }
  #bt .foe .bar { border-color: #6a4a3a; background: rgba(0,0,0,.4); }
  #bt .foe .tell { margin-top: 8px; font: 22px/1.4 var(--kai); color: #f0dca8; }
  #bt .foe .tell em { margin: 0 8px 0 0; background: #8e2a20; color: #f8ecd0; vertical-align: 1px; }
  #bt .cmd { left: 400px; bottom: 24px; width: 1070px; box-sizing: border-box; padding: 14px 22px 14px; pointer-events: auto; color: var(--ink); background: rgba(247,238,216,.93); border: 2px solid #3d2a1c; border-radius: 8px; box-shadow: inset 0 0 0 2px rgba(168,54,42,.22), 0 8px 24px rgba(0,0,0,.45); }
  #bt .cmd .who { margin-bottom: 8px; font: 600 23px var(--kai); letter-spacing: .12em; color: #8e2a20; }
  #bt .cmd .list { display: flex; flex-wrap: wrap; gap: 12px; }
  #bt .cmd .c { padding: 9px 22px 10px 16px; font: 600 28px var(--kai); letter-spacing: .06em; background: linear-gradient(180deg, #f7eed8, #e4d5b0); border: 2px solid #3d2a1c; border-radius: 6px; }
  #bt .cmd .c b { margin-right: 12px; font-weight: 600; color: #8e2a20; }

<div id="boot">载入中……</div>
<script>
/* 载入器。脚本一个接一个执行：前一个没到，后一个不动。
   服务器偶尔会对某一个文件回 503（0.5.1 时场次表就这样丢过），取不到就自己重试；
   试了几回还不行，把话说在屏幕上，不留一块黑屏。
   地址后面带版本号，换了版本浏览器就不会拿旧文件来凑。 */
(function () {
  var V = window.JX_V = '0.13.0';
  var FILES = [
    'src/core.js',
    'src/paint.js',
    'src/ground.js',
    'src/figures.js',
    'src/portraits.js',
    'src/portraits2.js',
    'src/portraits3.js',
    'src/artpack.js',
    'src/portraits4.js',
    'src/world.js',
    'src/scenes1.js',
    'src/scenes2.js',
    'src/scenes3.js',
    'src/scenes4.js',
    'src/scenes5.js',
    'src/scenes6.js',
    'src/scenes7.js',
    'src/scenes8.js',
    'src/scenes9.js',
    'src/scenes10.js',
    'src/scenes11.js',
    'src/decor.js',
    'src/audio.js',
    'src/ui.js',
    'src/gallery.js',
    'src/battle.js',
    'data/prologue.js',
    'data/chapter1.js',
    'data/chapter2.js',
    'data/chapter3.js',
    'data/checkpoints.js',
    'src/story.js',
    'src/story2.js',
    'src/story2b.js',
    'src/story2c.js',
    'src/story3.js',
    'src/story3b.js',
    'src/main.js'
  ];
  var boot = document.getElementById('boot'), TRIES = 5;
  function fail(src) {
    boot.className = 'bad';
    boot.innerHTML = '有一个文件没有取到（' + src + '）。<br>多半是网络或服务器一时的问题。<br><span>重新载入</span>';
    boot.querySelector('span').onclick = function () { location.reload(); };
  }
  function load(src, n) {
    return new Promise(function (res, rej) {
      var el = document.createElement('script');
      el.src = src + '?v=' + V + (n ? '&retry=' + n : '');
      el.onload = function () { res(); };
      el.onerror = function () {
        el.remove();
        if (n + 1 >= TRIES) rej(src);
        else setTimeout(function () { load(src, n + 1).then(res, rej); }, 350 * (n + 1));
      };
      document.head.appendChild(el);
    });
  }
  FILES.forEach(function (f) { var l = document.createElement('link'); l.rel = 'preload'; l.as = 'script'; l.href = f + '?v=' + V; document.head.appendChild(l); });   // 先并排取着，执行时还是按顺序
  window.JX_LOADING = FILES.reduce(function (p, f) { return p.then(function () { return load(f, 0); }); }, Promise.resolve())
    .then(function () { return window.JX.Art && window.JX.Art.preload ? window.JX.Art.preload() : null; })      /* 主角的头像先取好 */
    .then(function () { boot.remove(); return window.JX.boot(); })
    .catch(function (e) { document.body.appendChild(boot); if (typeof e === 'string') fail(e); else { boot.className = 'bad'; boot.textContent = '启动时出了错：' + (e && e.message || e); throw e; } });
})();
</script>
